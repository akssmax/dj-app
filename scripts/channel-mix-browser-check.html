<!doctype html>
<meta charset="utf-8">
<title>Cue channel Automix verification</title>
<style>body{font:14px system-ui;background:#15191f;color:#e8edf5;padding:24px}button{font:inherit;padding:12px}li{margin:10px 0}.pass{color:#9ae6b4}.fail{color:#ff9696}</style>
<h1>Channel Automix audio checks</h1>
<p>Renders a separate offline graph with generated stereo tracks. No speakers, library, or MIDI state are used.</p>
<button id="run">Render and check transitions</button><ol id="results"></ol>
<script type="module">
import { DJEngine } from '/src/lib/dj/engine.ts';
import { planTransitions } from '/src/lib/dj/planner.ts';
const results=document.querySelector('#results');
const report=(condition,label)=>{const li=document.createElement('li');li.className=condition?'pass':'fail';li.textContent=(condition?'PASS: ':'FAIL: ')+label;results.append(li);if(!condition)throw new Error(label)};
function wav(channel, amplitude){
 const rate=44100, length=rate*12, bytes=new ArrayBuffer(44+length*4), data=new DataView(bytes);
 const tag=(offset,text)=>[...text].forEach((ch,i)=>data.setUint8(offset+i,ch.charCodeAt(0)));
 tag(0,'RIFF');data.setUint32(4,bytes.byteLength-8,true);tag(8,'WAVE');tag(12,'fmt ');data.setUint32(16,16,true);data.setUint16(20,1,true);data.setUint16(22,2,true);data.setUint32(24,rate,true);data.setUint32(28,rate*4,true);data.setUint16(32,4,true);data.setUint16(34,16,true);tag(36,'data');data.setUint32(40,length*4,true);
 for(let i=0;i<length;i++)for(let c=0;c<2;c++){
  const signal=c===channel?amplitude*[80,1000,6000].reduce((sum,f)=>sum+Math.sin(2*Math.PI*f*i/rate),0):0;
  data.setInt16(44+(i*2+c)*2,Math.max(-32767,Math.min(32767,Math.round(signal*32767))),true);
 }
 return new Blob([bytes],{type:'audio/wav'});
}
const track=(id,file)=>({id,title:id,artist:'Cue fixture',genre:'House',url:'',file,duration:12,bpm:120,key:'Am',camelot:'8A',energy:5,color:'#abc',source:'local',analysis:{peaks:[],energyCurve:[],bpm:120,beatOffset:0,key:'Am',camelot:'8A',energy:5,confidence:1}});
const rms=(samples,from,to)=>{let sum=0;for(let i=Math.floor(from*44100);i<Math.floor(to*44100);i++)sum+=samples[i]**2;return Math.sqrt(sum/((to-from)*44100))};
const band=(samples,time,f)=>{let re=0,im=0;const start=Math.floor(time*44100),n=4410;for(let i=0;i<n;i++){re+=samples[start+i]*Math.cos(2*Math.PI*f*i/44100);im+=samples[start+i]*Math.sin(2*Math.PI*f*i/44100)}return 2*Math.hypot(re,im)/n};
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;
 try{
  const a=track('out',wav(0,0.08)), b=track('in',wav(1,0.16));
  for(const id of ['fade','bass','long','blend','harmonic','filter','loop','echo','reverb','cut']){
   const context=new OfflineAudioContext(2,44100*5,44100);
   Object.defineProperty(context,'resume',{value:async()=>{}});
   Object.defineProperty(context,'close',{value:async()=>{}});
   Object.defineProperty(context,'createMediaStreamDestination',{value:()=>Object.assign(context.createGain(),{stream:new MediaStream()})});
   const engine=new DJEngine(()=>context);
   try{
    engine.setMaster(1);
    await engine.load('A',a);await engine.load('B',b);
    const chosen=planTransitions(a,b,0,{outCue:0,inCue:0}).find(p=>p.id===id);
    await engine.startAuto('A',{...chosen,duration:id==='cut'?0.08:4},true);
    await new Promise(resolve=>setTimeout(resolve,150));
    report(engine.state.auto && engine.state.crossfade===0.5,`${id}: crossfader stays at 50% and audio is scheduled`);
    const matchedTrim=engine.state.B.trim-engine.state.A.trim;
    report(Math.abs(matchedTrim+6.0206)<0.15,`${id}: double-amplitude incoming audio is matched within 0.15dB`);
    const audio=await context.startRendering(), left=audio.getChannelData(0),right=audio.getChannelData(1);
    const finite=[...left,...right].every(Number.isFinite);
    const tail=['echo','reverb'].includes(id);
    const released=tail?rms(left,4.4,4.8)<rms(left,0.15,0.4)*0.5:rms(left,4.4,4.8)<0.00001;
    report(finite&&released&&rms(right,4.4,4.8)>0.02,`${id}: finite rendered audio completes A-to-B handoff`);
    if(id==='fade'){
     const initial=rms(left,0.15,0.4), final=rms(right,4.4,4.8),middle=Math.hypot(rms(left,2,2.1),rms(right,2,2.1));
     report(Math.abs(20*Math.log10(final/initial))<0.2&&Math.abs(20*Math.log10(middle/initial))<0.3,'Channel Fade: measured level stays within 0.3dB across the blend');
    }
    if(id==='bass'){
     report(band(right,0.9,80)<band(right,2.5,80)*0.5&&band(left,2.5,80)<band(left,0.9,80)*0.5,'Bass Swap: rendered low frequencies pass from A to B');
    }
    if(id==='long'){
     report(band(right,1.3,6000)>band(right,1.3,1000)*1.4&&band(right,2.5,1000)>band(right,1.3,1000)*1.5,'Long Blend: HI arrives before MID in the rendered audio');
     report(band(right,2.5,80)<band(right,3.5,80)*0.6,'Long Blend: LOW arrives after HI and MID');
    }
   }finally{engine.dispose()}
  }
  const li=document.createElement('li');li.textContent='All offline audio checks passed.';results.append(li);
 }catch(error){const li=document.createElement('li');li.className='fail';li.textContent=String(error.stack||error);results.append(li)}
};
</script>
